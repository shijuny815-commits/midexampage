    <body>
        <div class="header">
            <div class="page chioce"><!--every link to page   -->

                    <a href="view.html">essential view</a>
                    <a href="food.html">suggest food</a>
                    <a href="count.html" class="picked">count for fly</a>
            </div>
        <div>
        <p>Money: <span id="money-display">0</span></p>
        <button id="add-btn">Add +1</button>
        <button id="buinesss-tiketfly">
        <script>
            let money = 0;
            let isAdded = false; 
            const display = document.getElementById("money-display");
            const button = document.getElementById("add-btn");

            button.addEventListener("click", function() {
                if (!isAdded) {
                    money = money + 1;
                    isAdded = true;
                    button.textContent = "Cancel (-1)";
                    button.classList.add("active"); 
                } else {
                    money = money - 1;
                    isAdded = false;
                    button.textContent = "Add +1";
                    button.classList.remove("active"); 
                }
                display.textContent = money;
            });
        </script>
    </body>
</html>
