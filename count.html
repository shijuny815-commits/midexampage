
<html>
    <head>
         <title>FRANCE the best chioce for traval</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <div class="header">
            <div class="page chioce"><!--every link to page   -->
                    <a href="index.html">HOME</a>
                    <a href="view.html">essential view</a>
                    <a href="food.html">suggest food</a>
                    <a href="count.html" class="picked">count for fly</a>
            </div>
        <div>
            
        <div class="selection-container">
            <!-- 1. 總金額移到上方正中間 -->
            <div class="total-money">
                Total Money: <span id="money-display">0</span>
            </div>

            <!-- 第一行：機票種類 -->
            <div class="row-group">
                <h3>1. Select Flight Ticket Type</h3>
                <button class="option-btn" data-price="5000">Economy (+$5000)</button>
                <button class="option-btn" data-price="12000">Business (+$12000)</button>
                <button class="option-btn" data-price="25000">First Class (+$25000)</button>
            </div>

            <!-- 第二行：旅遊天數 -->
            <div class="row-group">
                <h3>2. Select Travel Duration</h3>
                <button class="option-btn" data-price="3000">1 Day (+$3000)</button>
                <button class="option-btn" data-price="6000">2 Days (+$6000)</button>
                <button class="option-btn" data-price="9000">3 Days (+$9000)</button>
            </div>
        </div>

        <script>
            let totalMoney = 0;
            const display = document.getElementById("money-display");
            const buttons = document.querySelectorAll(".option-btn");

            buttons.forEach(function(button) {
                button.addEventListener("click", function() {
                    let price = parseInt(button.getAttribute("data-price"));

                    if (!button.classList.contains("active")) {
                        totalMoney += price;
                        button.classList.add("active");
                    } else {
                        totalMoney -= price;
                        button.classList.remove("active");
                    }

                    display.textContent = totalMoney;
                });
            });
        </script>
    </body>
</html>
